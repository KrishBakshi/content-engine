[project]
name = "content-engine"
version = "0.1.0"
description = "Zero-token tech & AI news ingestion from free public JSON, RSS and Atom endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "defusedxml>=0.7",
]

[project.scripts]
content-engine = "content_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
